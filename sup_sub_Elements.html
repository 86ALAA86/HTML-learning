<body>
     <b>Basic Usage of the sup sub Tags :</b>
    <p>This example uses both sup and sub tags to show different usages .</p>
   
    <p>SUB : The chemical formula of water is <strong>H <sub>2</sub>O</strong></p>
    <br>
    
    <p>SUP : She is in the <strong>1 <sup>st</sup></strong> floor</p>
    <p>SUP : I won the <strong>2 <sup>nd</sup></strong> place in Hackathon</p>
    
    
</body>
