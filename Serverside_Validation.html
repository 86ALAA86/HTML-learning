<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <form action="TargetPage.html" method="post" id="registrationForm">
        <label for="email">Email :</label>
        <input type="email" name="email" id="email" required placeholder="Enter a valid Email.">
        <br><br>

        <label for="age">Age :</label>
        <input type="number" name="age" id="age" min="18" max="65" required title="Age must be between 18 and 65.">
        <br><br>

        <label for="website">Website :</label>
        <input type="url" name="website" id="website" pattern="https?://.*" required title="Include http:// or https://">
        <br><br>

        <label for="password">Password :</label>
        <input type="password" name="password" id="password" minlength="8" required title="Password must be at least 8 characters long">
        <br><br>

        <label for="phone">Phone:</label>
        <input type="tel" name="phone" id="phone" pattern="[0-9]{10}" required title="Enter a 10-digit phone number without dashes or spaces.">
        <br><br>
   
        <label for="dob">Date Of Birth:</label>
        <input type="date" name="dob" id="dob" required >
        <br><br>

        <label for="favcolor">Favorite Color :</label>
        <input type="color" name="favcolor" id="favcolor" required >
        <br><br>
   
   
   <button type="submit"> Submit</button>
   
   
   
   
   
   
   
   
    </form>
    
</body>
</html>
